spring.application.name=pw01-webserver
# 프로필을 정하지 않고 실행하면 local로 뜬다(각자 PC). 배포는 SPRING_PROFILES_ACTIVE=prod, 테스트는 test
spring.profiles.default=local

# ---- JPA ----
# 스키마는 Flyway 마이그레이션(db/migration)이 만들고, Hibernate는 엔티티와 맞는지 검사만 한다
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# 시각은 UTC로 저장·조회한다. Instant는 MySQL datetime 칼럼에 매핑한다
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.type.preferred_instant_jdbc_type=TIMESTAMP
# 목록 API의 페이지 크기 상한. 값은 목록 API를 설계할 때 정한다
#spring.data.web.pageable.max-page-size=

# ---- Redis ----
# Redis는 RedisTemplate으로만 쓴다. Redis 저장소(@RedisHash) 스캔을 꺼서 JPA 저장소에 대한 안내 로그를 없앤다
spring.data.redis.repositories.enabled=false

# ---- 인증 ----
# 값의 뜻·관계는 루트 docs/contracts/redis-keys.md "설정 값" 절. 시간은 1초 이상의 초 단위(Redis EXPIRE)
# 세션 수명. 인증이 필요한 요청마다 이 값으로 다시 건다. 접속 점검 간격 × 허용 연속 실패보다 길어야 한다(점검 값은 게임 설정)
pw01.auth.session.ttl=10m
# 로그인 실패: 첫 실패부터 window 안에 max-attempts번 틀리면 그 응답부터 lock 동안 잠긴다
pw01.auth.login-fail.max-attempts=5
pw01.auth.login-fail.window=1m
pw01.auth.login-fail.lock=1m

# ---- 스테이지 플레이·결과(S2) ----
# 값의 뜻은 루트 docs/contracts/stage-play-api.md "마감"·result-api.md "검사"
# 스테이지 플레이 유효 시간: 시작 뒤 이 시간 안에 결과를 내야 한다(보내지 못한 결과를 다시 켠 뒤 보내는 경우까지)
pw01.stage-play.validity=24h
# 플레이 시간 상한과, 서버가 잰 경과 시간에 더해 주는 여유
pw01.stage-play.play-time-max=2h
pw01.stage-play.play-time-slack=60s
# 결과 저장이 부딪혔을 때 다시 하는 횟수는 아래 pw01.progress.save-attempts(ProgressWriter)를 같이 쓴다

# ---- 웨이브 정의 읽는 곳(판 12 S3) ----
# 값의 뜻은 루트 docs/contracts/stage-api.md "서버 정의 파일". classpath = 이미지 안 master/stage-waves.json(로컬·시험)
# 배포(prod)는 application-prod.properties에서 s3로 바꾼다. 나머지 정의 파일 셋은 늘 이미지 안 리소스
pw01.stage-content.source=classpath
# s3일 때 바뀌었는지 스스로 확인하는 간격(서버 사이 알림을 놓친 서버가 이 안에 따라옴, HEAD 한 번)
pw01.stage-content.safety-poll=5m

# ---- 플레이 체크포인트(M22) ----
# 값의 뜻은 루트 docs/contracts/stage-play-api.md "C1·C2. 체크포인트"·redis-keys.md "플레이 체크포인트"
# 체크포인트 판 안 값(state)을 JSON으로 썼을 때의 최대 크기. 넘으면 C1이 400
pw01.play-checkpoint.max-state-size=64KB

# ---- 계정 값을 바꾸는 요청(S3~): 진행 저장·중복 방지·스탯 투자 ----
# 값의 뜻은 루트 docs/contracts/stat-api.md "한 번만 반영"·redis-keys.md
# 같은 계정의 진행 행 저장(결과 제출·투자·해금)이 부딪혔을 때 다시 하는 횟수(ProgressWriter). 넘으면 409 VERSION_CONFLICT
pw01.progress.save-attempts=3
# 중복 방지(SF-5): 처음 응답을 기억하는 시간, 처리 중 표시 시간(1초 이상의 초 단위, Redis EXPIRE)
pw01.idempotency.ttl=24h
pw01.idempotency.in-progress-ttl=30s
# 묶음 투자 한 번에 담을 수 있는 최대 줄 수
pw01.stat-invest.max-entries=10

# ---- 누적 통계 대조(S4) ----
# 결과 표(stage_play_result)를 다시 모아 누적 통계(account_stat_total)가 어긋났으면 고친다(StatTotalReconciler, 전용 스케줄러)
pw01.stat-total.reconcile.enabled=true
# 대조 사이 간격(서버가 뜬 뒤 이 시간이 지나 처음 돈다)
pw01.stat-total.reconcile.interval=6h
# 한 트랜잭션에서 보는 계정 수
pw01.stat-total.reconcile.batch-size=500
# ---- 랭킹(M7) ----
# 값의 뜻은 루트 docs/contracts/ranking-api.md "점수"·"쿼리", redis-keys.md 랭킹 절 "설정 값". 시간은 1초 이상의 초 단위
# 받는 난이도와 점수 배수는 master/difficulties.json(M9, stage-api.md "서버 정의 파일")
# 목록 한 묶음 기본·최대 줄 수
pw01.ranking.page-size=20
pw01.ranking.max-page-size=50
# 스테이지 점수 = 기본 + floor(시간 점수 최대 × 남은 시간 / 권장 클리어 시간)
pw01.ranking.score-base=1000
pw01.ranking.score-time-weight=9000
# Redis 보드 수명: 전체·진행 보드는 고칠 때마다 이 시간으로 다시, 주간 보드는 그 주 끝 + 보관 기간
pw01.ranking.all-board-ttl=30d
pw01.ranking.weekly-retention=14d
# 다시 채우기: 잠금 시간 < 임시 보드 수명(아니면 서버가 뜨지 않음), 한 번에 넣는 줄 수
pw01.ranking.rebuild-lock-ttl=30s
pw01.ranking.build-ttl=60s
pw01.ranking.build-batch-size=500

# ---- 실시간 연결(S7) ----
# 값의 뜻은 루트 docs/contracts/realtime-api.md "Heartbeat". ping-interval × max-missed-pongs는 세션 수명보다 짧아야 한다(아니면 서버가 뜨지 않음)
# 연결마다 Ping을 보내는 간격. Pong을 받을 때마다 세션을 다시 건다
pw01.realtime.ping-interval=60s
# 이만큼 연속으로 Pong이 없으면 연결을 닫는다(종료 코드 4003)
pw01.realtime.max-missed-pongs=3

# ---- 실시간 서버 사이 전달(M23 뼈대) ----
# 값의 뜻은 루트 docs/contracts/redis-keys.md "실시간 서버 사이 전달"·realtime-api.md "서버 여러 대"
# false면 서버 한 대처럼 이 서버 연결에만 보낸다(발행·구독 안 함). 되돌릴 때 쓰는 스위치
pw01.realtime.relay.enabled=true
pw01.realtime.relay.global-channel=pw01:realtime-relay:global
# 길드마다 채널: 앞부분 + 길드 ID. 서버는 앞부분 + * 패턴 하나로 모두 듣는다
pw01.realtime.relay.guild-channel-prefix=pw01:realtime-relay:guild:
pw01.realtime.relay.target-channel=pw01:realtime-relay:target
# 한 번에 지정할 수 있는 계정 수. 넘으면 보내지 않는다(그보다 많으면 전체 보내기를 쓴다)
pw01.realtime.relay.max-targets=500
# 게임에 갈 메시지 JSON의 최대 크기(바이트). 넘으면 보내지 않는다
pw01.realtime.relay.max-message-bytes=8192

# ---- 접속 상태(M23 길드) ----
# 값의 뜻은 루트 docs/contracts/redis-keys.md "접속 상태". 연결·Pong마다 다시 채우는 키 수명
# ping-interval보다 길어야 한다(아니면 서버가 뜨지 않음). 60초 × 2.5 = Pong 하나를 놓쳐도 꺼지지 않음
pw01.presence.ttl=150s

# ---- 길드(M23) ----
# 값의 뜻은 루트 docs/contracts/guild-api.md "규칙"
# 정원(만들 때 guild.max_members에 적힘)과 서버 전체 길드 수 상한
pw01.guild.max-members=30
pw01.guild.max-guilds=5
# 길드를 만들려면 클리어해야 하는 스테이지(마스터 데이터에 없으면 서버가 뜨지 않음)
pw01.guild.create-required-stage=stage.01.01
# 한 사람의 대기 중 가입 신청 수 상한과 신청 유효 기간
pw01.guild.max-pending-requests=3
pw01.guild.join-request-ttl=3d
# 탈퇴·추방 뒤 재가입 대기(Lv2, 0이면 끔)
pw01.guild.rejoin-cooldown=0s

# ---- 채팅(M23) ----
# 값의 뜻은 루트 docs/contracts/chat-api.md "규칙"·redis-keys.md "채팅"
# 글 최대 길이(코드 포인트). V11 guild_chat_message.text(VARCHAR(100))보다 길면 서버가 뜨지 않음
pw01.chat.max-length=100
# 횟수 제한: 창 안에서 max번까지(전체·길드 함께 셈)
pw01.chat.rate.window=10s
pw01.chat.rate.max=5
# 도배 쉬기: 횟수 제한에 처음 걸린 창마다 경고 1, strike-window 안에 경고 strikes번이면 duration 동안 채팅을 막음
pw01.chat.mute.strikes=3
pw01.chat.mute.strike-window=60s
pw01.chat.mute.duration=60s
# 길드 채팅 보관 기간과 내역 묶음 크기
pw01.chat.guild.retention=3d
pw01.chat.guild.page-size=10
pw01.chat.guild.page-size-max=50
# 보관 기간이 지난 길드 채팅 지우기(전용 스케줄러, cron은 UTC)
pw01.chat.cleanup.enabled=true
pw01.chat.cleanup.cron=0 30 3 * * *
pw01.chat.cleanup.batch-size=1000
# 길드 채팅 최근 묶음 캐시(Lv2)
pw01.chat.recent.enabled=true
pw01.chat.recent.size=10
# 길드 목록(G1) 한 번에 주는 수: 기본·최대
pw01.guild.list.default-size=20
pw01.guild.list.max-size=50

# ---- 로그 ----
# 줄마다 요청 번호(X-Request-Id, RequestIdFilter가 MDC에 넣음)를 붙인다. 요청 밖의 로그는 빈칸
logging.pattern.level=%5p [%X{requestId:-}]

# ---- JSON ----
# 요청 본문에 모르는 필드가 있으면 400(루트 docs/contracts/README.md 공통 규칙)
spring.jackson.deserialization.fail-on-unknown-properties=true

# ---- Actuator ----
# 웹에 여는 엔드포인트. prod는 앱 포트가 아닌 관리 포트에서만 열린다(application-prod.properties)
management.endpoints.web.exposure.include=health,info,metrics,loggers
# health에 DB·Redis 하위 상태를 보인다. prod에서는 밖에 열지 않는 관리 포트 안이다
management.endpoint.health.show-details=always
# 게임(타이틀 확인)과 서버 밖에서 보는 상태 확인 GET /health(루트 docs/contracts/README.md "서버 상태 확인").
# 앱 포트(server:)에 연다. DB·Redis가 모두 닿으면 200 UP, 아니면 503 DOWN. 하위 상태는 보이지 않는다
management.endpoint.health.group.game.include=db,redis
management.endpoint.health.group.game.show-details=never
management.endpoint.health.group.game.additional-path=server:/health
# info에 아래 info.* 값을 싣는다. 이름·버전·빌드 시각은 build.gradle의 buildInfo()가 넣는다
management.info.env.enabled=true
# 이미지를 만든 커밋. 이미지 빌드 때 APP_COMMIT으로 넣고, 로컬·테스트는 local
info.app.commit=${APP_COMMIT:local}

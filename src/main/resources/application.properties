spring.application.name=pw01-webserver
# 프로필을 정하지 않고 실행하면 local로 뜬다(각자 PC). 배포는 SPRING_PROFILES_ACTIVE=prod, 테스트는 test
spring.profiles.default=local

# ---- JPA ----
# 스키마는 Flyway 마이그레이션(db/migration)이 만들고, Hibernate는 엔티티와 맞는지 검사만 한다
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# 시각은 UTC로 저장·조회한다. Instant는 MySQL datetime 칼럼에 매핑한다
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.type.preferred_instant_jdbc_type=TIMESTAMP
# 목록 API의 페이지 크기 상한. 값은 목록 API를 설계할 때 정한다
#spring.data.web.pageable.max-page-size=

# ---- Redis ----
# Redis는 RedisTemplate으로만 쓴다. Redis 저장소(@RedisHash) 스캔을 꺼서 JPA 저장소에 대한 안내 로그를 없앤다
spring.data.redis.repositories.enabled=false

# ---- 인증 ----
# 값의 뜻·관계는 루트 docs/contracts/redis-keys.md "설정 값" 절. 시간은 1초 이상의 초 단위(Redis EXPIRE)
# 세션 수명. 인증이 필요한 요청마다 이 값으로 다시 건다. 접속 점검 간격 × 허용 연속 실패보다 길어야 한다(점검 값은 게임 설정)
pw01.auth.session.ttl=10m
# 로그인 실패: 첫 실패부터 window 안에 max-attempts번 틀리면 그 응답부터 lock 동안 잠긴다
pw01.auth.login-fail.max-attempts=5
pw01.auth.login-fail.window=1m
pw01.auth.login-fail.lock=1m

# ---- 스테이지 플레이·결과(S2) ----
# 값의 뜻은 루트 docs/contracts/stage-play-api.md "마감"·result-api.md "검사"
# 스테이지 플레이 유효 시간: 시작 뒤 이 시간 안에 결과를 내야 한다(보내지 못한 결과를 다시 켠 뒤 보내는 경우까지)
pw01.stage-play.validity=24h
# 플레이 시간 상한과, 서버가 잰 경과 시간에 더해 주는 여유
pw01.stage-play.play-time-max=2h
pw01.stage-play.play-time-slack=60s
# 결과 저장이 부딪혔을 때 다시 하는 횟수는 아래 pw01.progress.save-attempts(ProgressWriter)를 같이 쓴다

# ---- 계정 값을 바꾸는 요청(S3~): 진행 저장·중복 방지·스탯 투자 ----
# 값의 뜻은 루트 docs/contracts/stat-api.md "한 번만 반영"·redis-keys.md
# 같은 계정의 진행 행 저장(결과 제출·투자·해금)이 부딪혔을 때 다시 하는 횟수(ProgressWriter). 넘으면 409 VERSION_CONFLICT
pw01.progress.save-attempts=3
# 중복 방지(SF-5): 처음 응답을 기억하는 시간, 처리 중 표시 시간(1초 이상의 초 단위, Redis EXPIRE)
pw01.idempotency.ttl=24h
pw01.idempotency.in-progress-ttl=30s
# 묶음 투자 한 번에 담을 수 있는 최대 줄 수
pw01.stat-invest.max-entries=10

# ---- 누적 통계 대조(S4) ----
# 결과 표(stage_play_result)를 다시 모아 누적 통계(account_stat_total)가 어긋났으면 고친다(StatTotalReconciler, 전용 스케줄러)
pw01.stat-total.reconcile.enabled=true
# 대조 사이 간격(서버가 뜬 뒤 이 시간이 지나 처음 돈다)
pw01.stat-total.reconcile.interval=6h
# 한 트랜잭션에서 보는 계정 수
pw01.stat-total.reconcile.batch-size=500
# ---- 랭킹(M7) ----
# 값의 뜻은 루트 docs/contracts/ranking-api.md "점수"·"쿼리", redis-keys.md 랭킹 절 "설정 값". 시간은 1초 이상의 초 단위
# 받는 난이도(지금 0만). 쉼표로 더한다
pw01.ranking.difficulties=0
# 목록 한 묶음 기본·최대 줄 수
pw01.ranking.page-size=20
pw01.ranking.max-page-size=50
# 스테이지 점수 = 기본 + floor(시간 점수 최대 × 남은 시간 / 권장 클리어 시간)
pw01.ranking.score-base=1000
pw01.ranking.score-time-weight=9000
# Redis 보드 수명: 전체·진행 보드는 고칠 때마다 이 시간으로 다시, 주간 보드는 그 주 끝 + 보관 기간
pw01.ranking.all-board-ttl=30d
pw01.ranking.weekly-retention=14d
# 다시 채우기: 잠금 시간 < 임시 보드 수명(아니면 서버가 뜨지 않음), 한 번에 넣는 줄 수
pw01.ranking.rebuild-lock-ttl=30s
pw01.ranking.build-ttl=60s
pw01.ranking.build-batch-size=500

# ---- 실시간 연결(S7) ----
# 값의 뜻은 루트 docs/contracts/realtime-api.md "Heartbeat". ping-interval × max-missed-pongs는 세션 수명보다 짧아야 한다(아니면 서버가 뜨지 않음)
# 연결마다 Ping을 보내는 간격. Pong을 받을 때마다 세션을 다시 건다
pw01.realtime.ping-interval=60s
# 이만큼 연속으로 Pong이 없으면 연결을 닫는다(종료 코드 4003)
pw01.realtime.max-missed-pongs=3

# ---- 로그 ----
# 줄마다 요청 번호(X-Request-Id, RequestIdFilter가 MDC에 넣음)를 붙인다. 요청 밖의 로그는 빈칸
logging.pattern.level=%5p [%X{requestId:-}]

# ---- JSON ----
# 요청 본문에 모르는 필드가 있으면 400(루트 docs/contracts/README.md 공통 규칙)
spring.jackson.deserialization.fail-on-unknown-properties=true

# ---- Actuator ----
management.endpoints.web.exposure.include=health

# local: 각자 PC에서 실행할 때. 프로필을 정하지 않으면 이 프로필로 뜬다(application.properties)
# compose.yaml의 MySQL·Redis에 붙는다. 실행 구성의 환경 변수에 .env와 같은 이름·값을 넣는다
# (MYSQL_PASSWORD, REDIS_PASSWORD 필수. .env에서 포트를 바꿨다면 MYSQL_PORT·REDIS_PORT도.
#  MYSQL_PORT가 빠지면 3306으로 붙어, PC에 따로 설치된 MySQL과 부딪힐 수 있다)
spring.datasource.url=jdbc:mysql://127.0.0.1:${MYSQL_PORT:3306}/${MYSQL_DATABASE:pw01}
spring.datasource.username=${MYSQL_USER:pw01}
spring.datasource.password=${MYSQL_PASSWORD}

spring.data.redis.host=127.0.0.1
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD}

# 실행한 SQL을 로그로 본다(local에서만)
logging.level.org.hibernate.SQL=debug

# prod: 배포 서버(환경 변수 SPRING_PROFILES_ACTIVE=prod)
# 값은 배포 환경(AWS Parameter Store 등)에서 넣는다. 기본값을 두지 않아 빠지면 기동이 실패한다
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.password=${REDIS_PASSWORD}

# 웨이브 정의(stage-waves.json)의 원본은 S3 객체 하나. 서버는 EC2 역할로 읽기만 한다(비밀 값 없음)
# 버킷이 없거나 읽지 못하면 서버가 뜨지 않는다 → 배포 스크립트가 이전 컨테이너로 되돌림. 배포 전에 객체를 올려 둔다
pw01.stage-content.source=s3
pw01.stage-content.s3.bucket=pw01-content-k7m2q9
pw01.stage-content.s3.key=content/stage-waves.json
pw01.stage-content.s3.region=ap-northeast-2

# Actuator는 앱 포트(8080)가 아닌 관리 포트에서만 연다. 관리 포트는 밖에 열지 않는다(보안 그룹)
management.server.port=${MANAGEMENT_PORT:8081}
# 로그를 한 줄 JSON(ECS 형식)으로 쓴다. MDC의 requestId가 칸으로 들어간다
logging.structured.format.console=ecs

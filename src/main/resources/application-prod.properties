# prod: 배포 서버(환경 변수 SPRING_PROFILES_ACTIVE=prod)
# 값은 배포 환경(AWS Parameter Store 등)에서 넣는다. 기본값을 두지 않아 빠지면 기동이 실패한다
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.password=${REDIS_PASSWORD}

# Actuator는 앱 포트(8080)가 아닌 관리 포트에서만 연다. 관리 포트는 밖에 열지 않는다(보안 그룹)
management.server.port=${MANAGEMENT_PORT:8081}
# 로그를 한 줄 JSON(ECS 형식)으로 쓴다. MDC의 requestId가 칸으로 들어간다
logging.structured.format.console=ecs

# 로컬 전용 로드 밸런서(compose.apps.yaml의 lb): 배포 ALB 흉내 — 라운드 로빈, WebSocket, 유휴 120초
# nginx는 뜰 때 app-a·app-b 이름을 찾는다. lb를 다시 띄울 때는 두 앱이 떠 있어야 한다
upstream pw01_apps {
    # 순번을 일꾼 프로세스끼리 나눠 쓴다. 없으면 일꾼마다 첫 서버부터 세어 요청이 한쪽으로 몰린다(10/15 시험에서 겪음)
    zone pw01_apps 64k;
    server app-a:8080 max_fails=1 fail_timeout=10s;
    server app-b:8080 max_fails=1 fail_timeout=10s;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;

    location / {
        proxy_pass http://pw01_apps;
        proxy_http_version 1.1;
        # /realtime WebSocket 업그레이드를 넘긴다
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # ALB 유휴 제한(120초)과 같게. 실시간 Ping(60초)보다 길어야 조용한 연결이 끊기지 않는다
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        # 어느 앱으로 갔는지(로컬 시험용, 배포 ALB에는 없음)
        add_header X-Upstream $upstream_addr always;
    }
}

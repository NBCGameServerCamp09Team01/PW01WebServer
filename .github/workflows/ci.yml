# PR마다 빌드·테스트(./gradlew build). 문서만 바뀐 PR은 건너뛴다.
# 테스트의 MySQL·Redis 컨테이너(Testcontainers)는 GitHub 러너의 Docker로 뜬다.
name: CI

on:
  pull_request:
    branches: [dev, main]
    paths-ignore:
      - '**.md'
      - 'docs/**'

permissions:
  contents: read

# 같은 PR에 새 커밋이 오면 이전 실행을 취소한다
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Microsoft Build of OpenJDK 21. 로컬은 다른 배포판이어도 JDK 21이면 된다
      - uses: actions/setup-java@v6
        with:
          distribution: microsoft
          java-version: '21'

      # Gradle 캐시
      - uses: gradle/actions/setup-gradle@v6

      - name: Build and test
        run: ./gradlew build

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: build/reports/tests/

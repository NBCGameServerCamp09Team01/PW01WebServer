# 이미지 workflow(build-push-ecr.yml)가 dev에서 성공하면 그 커밋의 이미지를 EC2에 배포한다. 손 배포·되돌림도 여기서 한다.
# 파일 이름 규칙: <동작>-<대상>.yml. 서버에는 SSM Run Command(AWS-RunShellScript)로 /opt/pw01/deploy.sh <태그>를 부른다(22번 포트 없음).
# 서버 스크립트 원본은 deploy/deploy.sh(서버에는 사람이 놓는다 — deploy/README.md).
# AWS 접속은 OIDC로 역할 pw01-gha-deploy를 받는다(이미지 올리기 역할과 따로, 액세스 키 없음). 저장소 변수(Settings → Variables):
#   DEPLOY_ROLE_ARN   없으면 이 workflow 전체를 건너뛴다(실패 아님)
#   AUTO_DEPLOY       true일 때만 이미지 뒤에 자동으로 배포한다. 시험 중에는 false. 손 실행은 이 값과 상관없다
#   DEPLOY_CHECK_URL  배포 뒤 밖에서 부를 주소(예: http://<로드 밸런서 주소>/health). 비우면 건너뛴다
#   AWS_REGION·ECR_REPOSITORY  이미지 workflow와 같이 쓴다
name: Deploy to EC2

on:
  # 이미지 workflow가 끝나면(성공일 때만 아래 if에서 받음). workflow_run은 기본 브랜치(dev)에서 돈다
  workflow_run:
    workflows: ["Build and Push Image (ECR)"]
    types: [completed]
    branches: [dev]
  # 손 배포·되돌림(Actions 화면 → Run workflow). 역할 신뢰 조건이 dev 브랜치뿐이라 dev에서만 돈다
  workflow_dispatch:
    inputs:
      tag:
        description: "배포할 이미지 태그 dev-<커밋 40자>, 또는 rollback(서버의 직전 태그로)"
        required: true

permissions:
  id-token: write
  contents: read

# 동시 실행: 배포가 겹치면 서버 하나에 두 deploy.sh가 동시에 돌아 컨테이너가 꼬인다 → 한 group으로 묶는다.
#   - GitHub는 같은 group에 "실행 중 1개 + 대기 1개"만 둔다(GitHub 문서 "Control the concurrency of workflows and jobs").
#   - cancel-in-progress: false — 실행 중인 배포는 끊지 않는다(중간에 끊기면 서버가 반쯤 바뀐 채 남음).
#   - 대기 중에 새 배포가 오면 대기하던 것은 취소된다 → 병합이 몰리면 **마지막 커밋만 배포**된다. 배포는 최신이 이기면 되므로 의도대로다
#     (10/15 이전 주석 "차례로 돈다"는 틀렸음).
concurrency:
  group: deploy-ec2-prod
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      vars.DEPLOY_ROLE_ARN != '' && github.ref == 'refs/heads/dev' && (
        github.event_name == 'workflow_dispatch' ||
        (github.event.workflow_run.conclusion == 'success' && vars.AUTO_DEPLOY == 'true')
      )
    # ubuntu-latest는 10/19부터 Ubuntu 26으로 바뀐다 → 배포는 고정
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # 입력은 env로만 받는다(스크립트에 직접 끼우지 않음). 모양이 아니면 서버에 아무것도 보내지 않는다
      - name: Decide tag
        id: tag
        env:
          EVENT: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "$EVENT" = "workflow_run" ]; then
            TAG="dev-${HEAD_SHA}"
          else
            TAG="$INPUT_TAG"
          fi
          if ! printf '%s' "$TAG" | grep -Eq '^(dev-[0-9a-f]{40}|rollback)$'; then
            echo "::error::태그 모양이 아님: dev-<커밋 40자> 또는 rollback"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "배포 태그: $TAG ($EVENT)"

      - name: Get AWS role (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # 이미지 workflow가 올리기를 건너뛴 경우에도 "성공"으로 끝난다. 태그가 없으면 서버를 건드리지 않고 멈춘다
      - name: Check image in ECR
        if: steps.tag.outputs.tag != 'rollback'
        env:
          REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if ! aws ecr describe-images --repository-name "$REPOSITORY" --image-ids imageTag="$TAG" > /dev/null; then
            echo "::error::ECR ${REPOSITORY}에 ${TAG}가 없다. 서버는 그대로"
            exit 1
          fi

      # 배포 대상 = 태그 role=pw01-app이고 실행 중인 서버. 0대면(밤에 멈춤 등) 실패
      - name: Find app servers
        id: servers
        run: |
          IDS="$(aws ec2 describe-instances \
            --filters Name=tag:role,Values=pw01-app Name=instance-state-name,Values=running \
            --query 'Reservations[].Instances[].InstanceId' --output text)"
          if [ -z "$IDS" ]; then
            echo "::error::실행 중인 role=pw01-app 서버가 없다(멈춰 있으면 먼저 켠다)"
            exit 1
          fi
          echo "ids=$IDS" >> "$GITHUB_OUTPUT"
          echo "대상: $IDS"

      # 한 번에 한 대씩(--max-concurrency 1), 한 대라도 실패하면 다음 서버로 가지 않는다(--max-errors 0).
      # Run Command 셸에는 HOME이 없어 docker login이 설정 파일 위치를 못 잡을 수 있다 → HOME을 정해 준다
      - name: Run deploy.sh on servers
        id: run
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          IDS: ${{ steps.servers.outputs.ids }}
        run: |
          # shellcheck disable=SC2086
          CMD_ID="$(aws ssm send-command \
            --document-name AWS-RunShellScript \
            --instance-ids $IDS \
            --max-concurrency 1 --max-errors 0 \
            --timeout-seconds 120 \
            --comment "deploy ${TAG:0:20} run ${GITHUB_RUN_ID}" \
            --parameters "{\"commands\":[\"export HOME=/root\",\"/opt/pw01/deploy.sh ${TAG}\"],\"executionTimeout\":[\"600\"]}" \
            --query Command.CommandId --output text)"
          echo "cmd_id=$CMD_ID" >> "$GITHUB_OUTPUT"
          echo "명령 ID: $CMD_ID"

      # 모든 서버가 끝날 때까지(최대 10분) 기다린 뒤 출력을 보인다. deploy.sh는 비밀값을 찍지 않는다
      - name: Wait and show output
        env:
          CMD_ID: ${{ steps.run.outputs.cmd_id }}
          IDS: ${{ steps.servers.outputs.ids }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          EXPECTED="$(wc -w <<< "$IDS")"
          for i in $(seq 1 60); do
            STATUSES="$(aws ssm list-command-invocations --command-id "$CMD_ID" \
              --query 'CommandInvocations[].Status' --output text)"
            DONE="$(tr '\t' '\n' <<< "$STATUSES" | grep -cE '^(Success|Failed|TimedOut|Cancelled|Undeliverable|Terminated)$' || true)"
            echo "[$((i * 10))초] $STATUSES"
            if [ "$DONE" -ge "$EXPECTED" ]; then
              break
            fi
            sleep 10
          done

          FAILED=0
          {
            echo "### 배포 \`$TAG\`"
            echo "| 서버 | 결과 |"
            echo "|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          for ID in $IDS; do
            STATUS="$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$ID" \
              --query Status --output text 2>/dev/null || echo NotStarted)"
            echo "::group::$ID — $STATUS"
            aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$ID" \
              --query '[StandardOutputContent,StandardErrorContent]' --output text 2>/dev/null || true
            echo "::endgroup::"
            echo "| \`$ID\` | $STATUS |" >> "$GITHUB_STEP_SUMMARY"
            if [ "$STATUS" != "Success" ]; then
              FAILED=1
            fi
          done
          if [ "$FAILED" -ne 0 ]; then
            echo "::error::배포 실패 — deploy.sh가 이전 컨테이너로 되돌렸는지 위 출력에서 본다"
            exit 1
          fi

      # 로드 밸런서를 지나 밖에서 확인. 대상 그룹이 새 컨테이너를 "정상"으로 볼 때까지 조금 걸린다
      - name: Check from outside
        if: vars.DEPLOY_CHECK_URL != ''
        env:
          URL: ${{ vars.DEPLOY_CHECK_URL }}
        run: |
          for i in $(seq 1 12); do
            if curl -fsS --max-time 5 "$URL" | grep -q '"status":"UP"'; then
              echo "밖에서 UP: $URL"
              echo "밖에서 확인: UP" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 5
          done
          echo "::error::밖에서 UP을 받지 못함: $URL"
          exit 1
